<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // 1. List your target websites in an array
        const websites = [
            "https://www.google.com",
            "https://wikipedia.org"
        ];

        // 2. Pick a random website from the array
        const randomUrl = websites[Math.floor(Math.random() * websites.length)];

        // 3. Redirect the browser to that website
        window.location.replace(randomUrl);
    </script>
</head>
<body>
    <p>If you are not redirected automatically, please wait...</p>
</body>
</html>
